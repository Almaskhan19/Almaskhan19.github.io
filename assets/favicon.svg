<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28"/>
      <stop offset="100%" stop-color="#0f121a"/>
    </linearGradient>

    <!-- White Bright Highlight Facet -->
    <linearGradient id="whiteBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- White Shaded / Silver Facet -->
    <linearGradient id="whiteShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Cyan Highlight Ribbon Gradient -->
    <linearGradient id="cyanHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Blue Primary Ribbon Gradient -->
    <linearGradient id="bluePrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="60%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0047AB"/>
    </linearGradient>

    <!-- Deep Blue Shadow Gradient -->
    <linearGradient id="blueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004bbb"/>
      <stop offset="100%" stop-color="#002d7a"/>
    </linearGradient>

    <!-- Drop shadow under ribbon for 3D depth -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-1" dy="3" stdDeviation="2" flood-color="#050811" flood-opacity="0.9"/>
    </filter>

    <style>
      .tab-border {
        stroke: rgba(255, 255, 255, 0.1);
      }
      @media (prefers-color-scheme: light) {
        .tab-border {
          stroke: rgba(0, 0, 0, 0.18);
        }
      }
      @media (prefers-color-scheme: dark) {
        .tab-border {
          stroke: rgba(92, 158, 255, 0.4);
        }
      }
    </style>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="23" fill="url(#sqGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="22" fill="none" class="tab-border" stroke-width="1.2"/>

  <!-- ============================================== -->
  <!-- 1. LETTER A (WHITE STRUCTURE WITH 3D BEVELS)   -->
  <!-- ============================================== -->
  <!-- Left Leg Outer Bright Facet -->
  <polygon points="31,26 38,26 18,74 12,74" fill="url(#whiteBright)"/>
  <!-- Left Leg Inner Shaded Facet -->
  <polygon points="38,26 44,26 24.5,74 18,74" fill="url(#whiteShade)"/>

  <!-- Right Leg Upper - Left Facet -->
  <polygon points="38,26 43.5,26 53,50 48,50" fill="url(#whiteBright)"/>
  <!-- Right Leg Upper - Right Facet -->
  <polygon points="43.5,26 48.5,26 58,50 53,50" fill="url(#whiteShade)"/>

  <!-- Right Leg Lower (Foot) - Left Facet -->
  <polygon points="51,62 56.5,62 61.5,74 55.5,74" fill="url(#whiteBright)"/>
  <!-- Right Leg Lower (Foot) - Right Facet -->
  <polygon points="56.5,62 61.5,62 67.5,74 61.5,74" fill="url(#whiteShade)"/>

  <!-- Realistic cast shadow onto right leg right under the ribbon -->
  <polygon points="48,58 59,57 61,63 50,64" fill="#060910" opacity="0.9"/>

  <!-- ============================================== -->
  <!-- 2. K: VERTICAL STEM (TOP-CENTER)               -->
  <!-- ============================================== -->
  <polygon points="48.5,26 52.5,26 51.5,41 47.5,41" fill="url(#cyanHighlight)"/>
  <polygon points="52.5,26 56,26 55,41 51.5,41" fill="url(#bluePrimary)"/>

  <!-- ============================================== -->
  <!-- 3. K: LOWER DIAGONAL ARM                       -->
  <!-- ============================================== -->
  <!-- Upper Cyan Facet -->
  <polygon points="59,56 64.5,56 81.5,74 74,74" fill="url(#cyanHighlight)"/>
  <!-- Lower Blue Facet -->
  <polygon points="64.5,56 70,57 88,74 81.5,74" fill="url(#blueDeep)"/>

  <!-- ============================================== -->
  <!-- 4. CONTINUOUS BLUE RIBBON (SWOOSH + UPPER ARM) -->
  <!-- ============================================== -->
  <!-- Lower Facet (Deep Blue) -->
  <path d="M 31,64
           C 36,67 44,68 53,63
           C 61,58 67,51 73,42
           L 86,26
           L 80,26
           L 67,41
           C 61,49 55,56 46,60.5
           C 39,63 34,62 31,60
           Z"
        fill="url(#bluePrimary)" filter="url(#ribbonShadow)"/>

  <!-- Upper Facet (Radiant Cyan Glow) -->
  <path d="M 31,60
           C 34,62 39,63 46,60.5
           C 55,56 61,49 67,41
           L 80,26
           L 73.5,26
           L 62,42
           C 56,51 49,56 41,59.5
           C 36,61 33,60.5 31,59.5
           Z"
        fill="url(#cyanHighlight)"/>
</svg>
